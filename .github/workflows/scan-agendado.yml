name: Scan Agendado - Vigilancia Continua

on:
  schedule:
    - cron: '0 3 * * *'   # todos os dias as 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  revarredura-segredos:
    name: "Revarredura de Segredos (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  revarredura-dependencias:
    name: "Revarredura de Dependencias (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - novas CVEs desde o ultimo scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-agendado.sarif'

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-agendado-trivy
          path: trivy-agendado.sarif
          if-no-files-found: ignore

      - name: Notificar em caso de nova vulnerabilidade
        if: failure()
        run: |
          echo "Uma dependencia estavel ficou vulneravel sem nenhuma mudanca de codigo."
          echo "Por isso o gatilho agendado existe: o risco muda com o tempo."
