name: Pipeline Seguro CI/CD - DevSecOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write         # necessario para publicar a imagem no GHCR
  security-events: write  # necessario para publicar os relatorios SARIF em Security

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ============================================================
  # ESTACAO 1 - DETECCAO DE SEGREDOS (Gitleaks)
  # Roda primeiro: e rapida e pega o problema mais critico.
  # Qualquer segredo real QUEBRA o build, sem excecao.
  # ============================================================
  deteccao-segredos:
    name: "1 - Deteccao de Segredos (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # essencial: o Gitleaks precisa do historico completo

      - name: Rodar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # a action encerra com erro automaticamente se encontrar um segredo,
        # o que quebra este job e impede o avanco do pipeline.

  # ============================================================
  # ESTACAO 2 - SAST (Semgrep)
  # Analisa o codigo-fonte com regras de OWASP Top 10 e auditoria
  # de seguranca. So bloqueia em achados de severidade ERROR.
  # ============================================================
  sast-semgrep:
    name: "2 - SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: deteccao-segredos
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o Semgrep
        run: pip install semgrep

      - name: Rodar o Semgrep (OWASP + auditoria de seguranca)
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --json --output=semgrep-results.json

      - name: Avaliar a politica de portao (bloqueia so em ERROR)
        run: |
          ERROS=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep-results.json)
          AVISOS=$(jq '[.results[] | select(.extra.severity!="ERROR")] | length' semgrep-results.json)
          echo "Achados criticos (ERROR): $ERROS | Avisos: $AVISOS"
          echo "## Resultado do SAST (Semgrep)" >> $GITHUB_STEP_SUMMARY
          echo "- Criticos: $ERROS | Avisos: $AVISOS" >> $GITHUB_STEP_SUMMARY
          if [ "$ERROS" -gt 0 ]; then
            echo "Build bloqueado: ha achados ERROR no codigo."
            exit 1
          fi

      - name: Publicar relatorios como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semgrep
          path: semgrep-results.*

  # ============================================================
  # ESTACAO 3 - BUILD
  # App Python (app.py). Instala dependencias e valida que o
  # modulo principal importa sem erro de sintaxe.
  # ============================================================
  build:
    name: "3 - Build"
    runs-on: ubuntu-latest
    needs: sast-semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias (resolve o requirements.txt)
        run: pip install -r requirements.txt

      - name: Verificar que a aplicacao importa sem erros
        run: python -c "import app"

  # ============================================================
  # ESTACAO 4 - SCA (Trivy - dependencias)
  # Audita o requirements.txt resolvido no build. HIGH/CRITICAL bloqueia;
  # MEDIUM/LOW so avisa (estrategia de baseline).
  # ============================================================
  sca-trivy:
    name: "4 - SCA (Trivy - dependencias)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - bloqueia em HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          limit-severities-for-sarif: true

      - name: Trivy - relatorio informativo (nao bloqueia)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'LOW,MEDIUM'
          exit-code: '0'
          format: 'table'

      - name: Publicar relatorio do Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-dependencias
          path: trivy-fs-results.sarif
          if-no-files-found: ignore

  # ============================================================
  # ESTACAO 5 - PACKAGE
  # Constroi e publica a imagem Docker no GHCR, tageada com o sha.
  # ============================================================
  package:
    name: "5 - Package (build e publicacao da imagem)"
    runs-on: ubuntu-latest
    needs: sca-trivy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # ESTACAO 6 - SCAN DA IMAGEM (Trivy)
  # Audita a imagem publicada (SO base + camadas).
  # ============================================================
  scan-imagem-trivy:
    name: "6 - Scan da Imagem (Trivy)"
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Trivy - bloqueia em HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          limit-severities-for-sarif: true

      - name: Publicar relatorio da imagem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-trivy-imagem
          path: trivy-image-results.sarif
          if-no-files-found: ignore

  # ============================================================
  # ESTACAO 7 - DEPLOY EM HOMOLOGACAO + DAST (OWASP ZAP)
  # As duas ficam no MESMO job porque precisam compartilhar
  # a rede Docker do mesmo runner. App Python/Flask na porta 5000.
  # ============================================================
  homolog-e-dast:
    name: "7 - Deploy em Homologacao + DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: scan-imagem-trivy
    environment: homologacao
    steps:
      - uses: actions/checkout@v4

      - name: Subir a aplicacao no ambiente de teste
        run: |
          docker run -d --name app-homolog -p 5000:5000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "Aguardando a aplicacao responder..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5000/ > /dev/null; then
              echo "Aplicacao no ar."; break
            fi
            sleep 3
          done

      - name: Rodar o OWASP ZAP (baseline scan)
        run: |
          mkdir -p zap-report && chmod 777 zap-report
          docker run --rm --network host \
            -v $(pwd)/zap-report:/zap/wrk/:rw \
            -v $(pwd)/.zap/rules.tsv:/zap/rules.tsv:ro \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 \
              -r zap-report.html -J zap-report.json \
              -c /zap/rules.tsv -I
        continue-on-error: true

      - name: Avaliar a politica de portao do DAST (bloqueia em risco ALTO)
        run: |
          ALTOS=$(jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' zap-report/zap-report.json)
          echo "Achados de risco ALTO: $ALTOS"
          echo "## Resultado do DAST (OWASP ZAP)" >> $GITHUB_STEP_SUMMARY
          echo "- Achados de risco ALTO: $ALTOS" >> $GITHUB_STEP_SUMMARY
          if [ "$ALTOS" -gt 0 ]; then
            echo "Build bloqueado: o DAST encontrou vulnerabilidade de risco ALTO."
            exit 1
          fi

      - name: Publicar o relatorio do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-zap-dast
          path: zap-report/

      - name: Encerrar o container de teste
        if: always()
        run: docker rm -f app-homolog || true

  # ============================================================
  # ESTACAO 8 e 9 - APROVACAO HUMANA + DEPLOY EM PRODUCAO
  # O Environment "producao" com Required reviewers e o "botao
  # final": automacao ate aqui, decisao humana dai em diante.
  # ============================================================
  aprovacao-e-deploy-producao:
    name: "8 - Aprovacao Humana + Deploy em Producao"
    runs-on: ubuntu-latest
    needs: homolog-e-dast
    if: github.ref == 'refs/heads/main'
    environment:
      name: producao
    steps:
      - name: Confirmar aprovacao
        run: echo "Aprovado por um revisor humano. Prosseguindo com o deploy."

      - name: Deploy em producao
        run: |
          echo "Adapte este passo para o seu provedor (Kubernetes, ECS, VM, etc.)."
          echo "Exemplo: kubectl set image deployment/app app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ============================================================
  # RESUMO DA ESTEIRA - notificacao e auditoria
  # ============================================================
  resumo-da-esteira:
    name: "Resumo da Esteira"
    runs-on: ubuntu-latest
    needs: [deteccao-segredos, sast-semgrep, sca-trivy, scan-imagem-trivy, homolog-e-dast]
    if: always()
    steps:
      - name: Publicar o resumo no sumario da execucao
        run: |
          echo "# Resumo da Esteira Segura" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Segredos | ${{ needs.deteccao-segredos.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA | ${{ needs.sca-trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | ${{ needs.scan-imagem-trivy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST | ${{ needs.homolog-e-dast.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notificar em caso de falha (exemplo com Slack)
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Aqui entraria a chamada ao seu webhook de notificacao."
          echo 'curl -X POST -H "Content-type: application/json" --data "{\"text\":\"Pipeline falhou\"}" $SLACK_WEBHOOK_URL'
