# =============================================================
# 06-secret-corrigido.yaml
# Substitui o ConfigMap "simulador-cartoes-config" (texto claro) por
# um Secret de verdade. Os valores abaixo estão em Base64 — LEMBRETE
# DA AULA DE SAST/DAST: Base64 não é criptografia, é apenas
# codificação, trivialmente reversível por qualquer um com acesso de
# leitura ao Secret. A proteção real vem de três camadas combinadas,
# tratadas na Parte 9 do laboratório: RBAC restritivo sobre quem lê
# Secrets, Encryption at Rest no etcd, e (idealmente, em produção) um
# gerenciador de segredos externo.
#
# Os valores abaixo foram gerados com:
#   echo -n 'Cart0es@2024' | base64
#   echo -n 'bandeira_live_4f8e2a1b9c7d6e5f' | base64
# =============================================================
apiVersion: v1
